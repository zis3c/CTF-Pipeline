name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Shell syntax
        run: |
          mapfile -t sh < <(find bin -maxdepth 1 -type f ! -name '*.ps1')
          bash -n "${sh[@]}" test-corpus/smoke-test.sh
      - name: Python syntax
        run: python -m py_compile scripts/*.py test-corpus/ctfd-integration-test.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: CTFd API integration fixture
        run: test-corpus/ctfd-integration-test.py
      - name: Check documentation links and whitespace
        run: git diff --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install requests
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem bin/*.ps1, config/*.ps1, test-corpus/windows-smoke.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "FAIL $($_.Name): $($errors[0].Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Python syntax
        run: python -m py_compile scripts/ctf-pipeline.py ctfd/__init__.py ctfd/__main__.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: CTFd API integration fixture
        run: python test-corpus/ctfd-integration-test.py
      - name: Windows smoke test
        shell: pwsh
        run: ./test-corpus/windows-smoke.ps1
